[package]
name = "rig-agentcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Run a Rig agent on AWS Bedrock AgentCore Runtime: the HTTP protocol contract (/invocations, /ping), sessions, streaming and traces AgentCore Observability and Evaluations read."
keywords = ["rig", "agentcore", "aws", "agents", "llm"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
futures = "0.3"
rig-agent = { version = "0.47", default-features = false }
rig-core = { version = "0.47", default-features = false }
rig-memory = { version = "0.47", default-features = false }
rig-otel = { version = "0.47.0", path = "../rig-otel", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "macros", "signal"] }
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tempfile = "3"
rig-agent = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-memory = { version = "0.47", default-features = false, features = ["fs"] }
rig-core = { version = "0.47", default-features = false, features = ["reqwest", "rustls", "test-utils"] }
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
