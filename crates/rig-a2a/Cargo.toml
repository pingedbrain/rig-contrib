[package]
name = "rig-a2a"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["rig", "a2a", "agents", "llm", "interoperability"]
categories = ["network-programming", "web-programming::http-server"]
# Not on crates.io until the Rig maintainers weigh in on the name (0xPlaygrounds/rig#391).
description = "Serve Rig agents over the Agent2Agent (A2A) protocol and call remote A2A agents as Rig tools, built on the official A2A Rust SDK."

[features]
# W3C trace context and sessions across agents: a call to a remote agent and
# the task it starts make one OpenTelemetry trace.
otel = ["dep:rig-otel"]

# A2A serving is native-only: the SDK's server runs on tokio and axum.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-agent = { version = "0.47", default-features = false }
rig-core = { version = "0.47", default-features = false }
rig-memory = { version = "0.47", default-features = false }
a2a = { package = "a2a-lf", version = "0.4" }
a2a-server = { package = "a2a-server-lf", version = "0.6" }
a2a-client = { package = "a2a-client-lf", version = "0.3" }
serde = { version = "1", features = ["derive"] }
schemars = "1"
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time"] }
async-stream = "0.3"
axum = "0.8"
chrono = "0.4"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tower-http = { version = "0.6", features = ["limit"] }
rig-otel = { version = "0.47.0", path = "../rig-otel", default-features = false, optional = true }
async-trait = "0.1"

[dev-dependencies]
rig-agent = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-core = { version = "0.47", default-features = false, features = ["reqwest", "rustls", "test-utils"] }
anyhow = "1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Doctests only: DirStore is behind rig-memory's fs feature.
rig-memory = { version = "0.47", default-features = false, features = ["fs"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
