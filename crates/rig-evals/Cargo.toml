[package]
name = "rig-evals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Evaluations for Rig agents: datasets of cases, built-in and LLM-judge evaluators, repetitions and pass-rate thresholds, JSON, JUnit and Markdown reports, OpenTelemetry GenAI evaluation events."
keywords = ["rig", "evaluation", "agents", "llm", "testing"]
categories = ["development-tools::testing"]

[features]
# Target for rig-multiagent nodes (swarms, graphs).
multiagent = ["dep:rig-multiagent"]
# Targets and evaluators on AWS Bedrock AgentCore: invoke a deployed runtime,
# read its spans from CloudWatch Logs, score them with AgentCore Evaluations.
agentcore = ["dep:aws-config", "dep:aws-sdk-bedrockagentcore", "dep:aws-sdk-cloudwatchlogs", "dep:aws-smithy-types", "dep:uuid"]

[dependencies]
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"], optional = true }
aws-sdk-bedrockagentcore = { version = "1.90", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudwatchlogs = { version = "1.167", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-smithy-types = { version = "1", optional = true }
futures = "0.3"
regex = "1"
rig-agent = { version = "0.47", default-features = false }
rig-core = { version = "0.47", default-features = false }
rig-multiagent = { version = "0.47.0", path = "../rig-multiagent", optional = true }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"], optional = true }

[dev-dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
rig-agent = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-core = { version = "0.47", default-features = false, features = ["reqwest", "rustls", "test-utils"] }
rig-otel = { version = "0.47.0", path = "../rig-otel", default-features = false }
tempfile = "3"
xmlparser = "0.13"
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
