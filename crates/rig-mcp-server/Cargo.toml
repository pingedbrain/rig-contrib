[package]
name = "rig-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
description = "Serve Rig agents and tools over the Model Context Protocol (MCP): agents as tools with sessions, streamed progress and cancellation; typed agents with structured output; stdio and Streamable HTTP."
repository.workspace = true
keywords = ["rig", "mcp", "agents", "llm", "tools"]
categories = ["network-programming", "web-programming::http-server"]

[features]
# Continue a client's trace (W3C trace context from HTTP headers or the
# request's `_meta`) and give agent calls a `session.id`, through rig-otel.
otel = ["dep:rig-otel", "dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
axum = "0.8"
base64 = "0.22"
futures = "0.3"
opentelemetry = { version = "0.32", optional = true }
rig-agent = { version = "0.47", default-features = false }
rig-core = { version = "0.47", default-features = false }
rig-memory = { version = "0.47", default-features = false }
rig-otel = { version = "0.47.0", path = "../rig-otel", default-features = false, optional = true }
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", optional = true }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
anyhow = "1.0.105"
tokio = { version = "1.54.1", features = ["full"] }
rig-core = { version = "0.47", default-features = false, features = ["reqwest", "rustls", "test-utils"] }
rig-agent = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-rmcp = "0.47"
rmcp = { version = "3.11", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
http = "1"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
