[package]
name = "rig-multiagent"
version.workspace = true
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
description = "Multi-agent patterns for Rig: a Swarm of agents that hand work to each other, and a Graph of agents and functions with conditional edges and parallel branches."
repository.workspace = true
keywords = ["rig", "agents", "multi-agent", "swarm", "llm"]
categories = ["asynchronous"]

[dependencies]
futures = "0.3"
rig-agent = { version = "0.47", default-features = false }
rig-core = { version = "0.47", default-features = false }
rig-memory = { version = "0.47", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
rig-core = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-agent = { version = "0.47", default-features = false, features = ["test-utils"] }
rig-memory = { version = "0.47", default-features = false, features = ["fs"] }
tempfile = "3"

[lints]
workspace = true
