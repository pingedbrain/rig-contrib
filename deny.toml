[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono is unmaintained. It comes in through the official A2A Rust SDK,
    # whose task timestamps are chrono::DateTime, so it cannot be swapped out
    # here; revisit when a2a-lf moves (to jiff, as the advisory suggests).
    { id = "RUSTSEC-2026-0543", reason = "transitive via a2a-lf; its public types use chrono" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
