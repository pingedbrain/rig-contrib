[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.47.3"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/pingedbrain/rig-contrib"

# Rig's own workspace lints (0xPlaygrounds/rig, Cargo.toml), so a crate here
# could move into Rig's repository as it is.
[workspace.lints.clippy]
dbg_macro = "forbid"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
expect_used = "deny"
expect_fun_call = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "forbid"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"
large_enum_variant = "allow"
result_large_err = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"
